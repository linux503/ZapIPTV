<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="dark light" />
  <title>ZapIPTV</title>
  <link rel="icon" href="img/brand-icon.png" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body data-theme="dark">
  <div id="loader" class="loader">
    <div class="loader-card">
      <img class="loader-logo" src="img/brand-icon.png" alt="" width="72" height="72" />
      <div class="status" id="load-msg">正在載入頻道…</div>
    </div>
  </div>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-icon" src="img/brand-icon.png" alt="ZapIPTV" width="36" height="36" />
        <div><strong>ZapIPTV</strong><small id="tagline">亞洲影視與直播應用</small></div>
      </div>
      <button class="nav-btn active" data-tab="home" type="button">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5.2v-5.4H10.2V21H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </span>
        <span id="nav-home">首頁</span>
      </button>
      <button class="nav-btn" data-tab="live" type="button">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="12" rx="2.2" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8M12 17.5V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="11.5" r="2.2" fill="currentColor"/></svg>
        </span>
        <span id="nav-live">直播</span>
      </button>
      <div class="nav-spacer"></div>
      <button class="nav-btn" data-tab="settings" type="button">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.1a1.5 1.5 0 0 0 .3 1.7l.1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.5 1.5 0 0 0-1.7-.3 1.5 1.5 0 0 0-.9 1.4V18.6a1.8 1.8 0 1 1-3.6 0v-.2a1.5 1.5 0 0 0-1-1.4 1.5 1.5 0 0 0-1.7.3l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.5 1.5 0 0 0 .3-1.7 1.5 1.5 0 0 0-1.4-.9H5.4a1.8 1.8 0 1 1 0-3.6h.2a1.5 1.5 0 0 0 1.4-1 1.5 1.5 0 0 0-.3-1.7l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.5 1.5 0 0 0 1.7.3h.1a1.5 1.5 0 0 0 .9-1.4V5.4a1.8 1.8 0 1 1 3.6 0v.2a1.5 1.5 0 0 0 .9 1.4 1.5 1.5 0 0 0 1.7-.3l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.5 1.5 0 0 0-.3 1.7v.1a1.5 1.5 0 0 0 1.4.9h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.5 1.5 0 0 0-1.4.9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </span>
        <span id="nav-settings">設定</span>
      </button>
    </aside>
    <div class="main">
      <section id="view-home" class="view active">
        <div class="home-scroll" id="home-sections"></div>
      </section>
      <section id="view-live" class="view">
        <div class="live-layout">
          <div class="groups">
            <h4 id="cat-label">分類</h4>
            <div id="group-list"></div>
          </div>
          <div class="list-panel">
            <div class="search-box">
              <span class="search-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16.2 16.2 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </span>
              <input id="search" type="search" placeholder="搜尋頻道" enterkeyhint="search" />
            </div>
            <div class="now-bar" id="now-bar">
              <small id="now-label">正在播放</small>
              <strong id="now-name"></strong>
            </div>
            <div class="channel-list" id="channel-list"></div>
          </div>
          <div class="player-panel">
            <div class="empty-player" id="empty-player">選擇一個頻道開始觀看</div>
            <video id="video" controls playsinline webkit-playsinline style="display:none"></video>
            <div class="player-bar" id="player-bar" style="display:none">
              <div><div class="title" id="play-title"></div><div class="sub" id="play-group"></div></div>
            </div>
          </div>
        </div>
      </section>
      <section id="view-settings" class="view settings">
        <h2 id="settings-title">設定</h2>
        <div class="setting-block">
          <h4 id="lang-label">語言</h4>
          <button class="opt-btn active" data-lang="hant" id="opt-hant" type="button">繁體</button>
          <button class="opt-btn" data-lang="hans" id="opt-hans" type="button">简体</button>
          <button class="opt-btn" data-lang="en" id="opt-en" type="button">English</button>
        </div>
        <div class="setting-block">
          <h4 id="theme-label">外觀</h4>
          <button class="opt-btn active" data-theme="dark" id="opt-dark" type="button">深色</button>
          <button class="opt-btn" data-theme="light" id="opt-light" type="button">淺色</button>
        </div>
        <div class="setting-block">
          <h4 id="ver-label">版本</h4>
          <p class="ver-line">2.0.7</p>
          <button class="opt-btn" id="btn-refresh" type="button">重新整理片源</button>
        </div>
      </section>
    </div>
  </div>
  <script src="js/app.all.js"></script>
</body>
</html>
