name: ZapIPTV
options:
  bundleIdPrefix: com.zapiptv
  knownRegions: [zh-Hant, zh-Hans, en]
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  ZapIPTV:
    type: application
    platform: macOS
    sources:
      - path: ZapIPTV
        excludes:
          - "**/*.md"
    info:
      path: ZapIPTV/Info.plist
      properties:
        CFBundleName: ZapIPTV
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleDisplayName: ZapIPTV
        CFBundleIdentifier: com.zapiptv.app
        CFBundleVersion: "44"
        CFBundleShortVersionString: "2.0.8"
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant, zh-Hans, en]
        NSHumanReadableCopyright: "© 2026 ZapIPTV"
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    entitlements:
      path: ZapIPTV/ZapIPTV.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true

    postBuildScripts:
      - name: Restore full AppIcon.icns
        script: |
          SRC="${SRCROOT}/ZapIPTV/Resources/AppIcon.icns"
          DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/AppIcon.icns"
          if [ -f "$SRC" ]; then
            cp -f "$SRC" "$DST"
            echo "Restored full AppIcon.icns ($(wc -c < "$DST") bytes)"
          else
            echo "warning: missing $SRC" >&2
          fi

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zapiptv.app
        PRODUCT_NAME: ZapIPTV
        INFOPLIST_FILE: ZapIPTV/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZapIPTV/ZapIPTV.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSET_CATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ARCHS: arm64 x86_64
        ONLY_ACTIVE_ARCH: NO
